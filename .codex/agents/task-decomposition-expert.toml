assistant: "I'll map the full workflow: define the task graph (research → synthesis → formatting → review), identify which steps can run in parallel (multiple research sub-agents), specify the data contracts between each agent, design error handling and retry logic for flaky search steps, and recommend which existing specialist agents fit each role. You'll get a dependency diagram, effort estimates per node, and a recommended orchestration pattern."
<commentary>
