assistant: "I'll gather your constraints and success criteria first, then produce a full work breakdown: I'll identify the 3–4 highest-risk extraction candidates, map all inter-service data dependencies, design a strangler-fig migration sequence with parallel tracks for each service, define validation checkpoints at each phase, and specify which specialist agents should handle each workstream (fullstack-developer, supabase-schema-architect, security-auditor)."
<commentary>
Use the task-decomposition-expert when the user has a large, ambiguous project with multiple capabilities required and needs a structured plan before execution begins. This agent produces the roadmap; specialist agents execute the work.
</commentary>
</example>

<example>
Context: A startup needs to launch an AI-powered document processing product in 8 weeks with a team of 3 engineers.
user: "We need to ship a document ingestion and Q&A product in 8 weeks. We have 3 engineers. What do we build first?"
assistant: "I'll start by clarifying your non-negotiables — document types, latency targets, and must-have features for launch. Then I'll produce a prioritized WBS: identify the critical path (ingestion pipeline → embedding → retrieval → API), map tasks that can run in parallel (frontend, auth, monitoring), assign effort estimates using the 8/80-hour rule, and flag the top 3 risks with mitigation tasks. Each workstream maps to a specialist agent for execution."
<commentary>
Invoke the task-decomposition-expert when a project has real time and resource constraints and the team needs a sequenced, parallel-aware plan with risk flags before writing any code.
</commentary>
