# Looks S6 (behind the 'looks' feature flag): a client opens "Your look
# pass" from the Discover looks rail -> sees their own look with what they
# asked for next to the result -> "This look again" lands on the date and
# time step of the normal booking flow with the same barber.
#
# NOT YET RUN. Same tooling gap as every other flow here (.maestro/README.md).
# Also needs migrations 0062-0068 applied (docs/genius/LOOKS.md).
#
# Prerequisites:
# - The test customer is in the 'looks' flag and confirmed at least one look
#   as their cut (barber-look-capture.yaml, then customer-look-confirm.yaml).
# - The barber is still approved, not blocked, and still offers the service.
# The flow stops at the date step on purpose: completing it would create a
# real pending request.
#
# Run with:
#   maestro test .maestro/customer-look-pass.yaml \
#     -e TEST_CUSTOMER_EMAIL=... -e TEST_CUSTOMER_PASSWORD=...
appId: com.privelier.app
env:
  TEST_CUSTOMER_EMAIL: customer.e2e@example.com
  TEST_CUSTOMER_PASSWORD: ChangeMe123!
---
- launchApp:
    clearState: true
- tapOn:
    id: "role-select-customer"
- tapOn:
    id: "auth-entry-login"
- tapOn:
    id: "auth-login-email"
- inputText: "${TEST_CUSTOMER_EMAIL}"
- tapOn:
    id: "auth-login-password"
- inputText: "${TEST_CUSTOMER_PASSWORD}"
- tapOn:
    id: "auth-login-submit"
- extendedWaitUntil:
    visible:
      id: "customer-home-screen"
    timeout: 15000

# --- Discover rail -> look pass ---
- scrollUntilVisible:
    element:
      id: "customer-home-looks-pass"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "customer-home-looks-pass"
- assertVisible:
    id: "customer-look-pass-screen"
- extendedWaitUntil:
    visible:
      id: "customer-look-pass-look-.*"
    timeout: 10000
- assertVisible:
    id: "customer-look-pass-reference-.*"
- assertVisible:
    id: "customer-look-pass-result-.*"

# --- This look again -> the normal booking flow, step 1 ---
- tapOn:
    id: "customer-look-pass-again-.*"
    index: 0
- assertVisible:
    id: "customer-booking-datetime-screen"
