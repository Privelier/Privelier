# Looks S4 (behind the 'looks' feature flag): a customer opens "Find a look"
# from the Discover rail -> picks a style, a day and a window -> sees who has
# proven that style and is free then -> "Book at HH:MM" -> lands on the
# address step of the normal booking flow with that time.
#
# NOT YET RUN. Same tooling gap as every other flow here (.maestro/README.md).
# Also needs migrations 0062-0066 applied (docs/genius/LOOKS.md).
#
# Prerequisites:
# - A test customer in the 'looks' flag, with the same city as the barber.
# - The barber has at least one confirmed or published skin_fade look (run
#   barber-look-capture.yaml and customer-look-confirm.yaml first) and is
#   available on the day picked below in the evening window.
# - The look's service still exists.
# The flow stops at the address step on purpose: completing it would create a
# real pending request (cover that with customer-booking-create.yaml). The
# optional photo is skipped: the system picker is outside the app.
#
# Run with:
#   maestro test .maestro/customer-look-search.yaml \
#     -e TEST_CUSTOMER_EMAIL=... -e TEST_CUSTOMER_PASSWORD=...
appId: com.privelier.app
env:
  TEST_CUSTOMER_EMAIL: customer2.e2e@example.com
  TEST_CUSTOMER_PASSWORD: ChangeMe123!
---
- launchApp:
    clearState: true
- tapOn:
    id: "role-select-customer"
- tapOn:
    id: "auth-entry-login"
- tapOn:
    id: "auth-login-email"
- inputText: "${TEST_CUSTOMER_EMAIL}"
- tapOn:
    id: "auth-login-password"
- inputText: "${TEST_CUSTOMER_PASSWORD}"
- tapOn:
    id: "auth-login-submit"
- extendedWaitUntil:
    visible:
      id: "customer-home-screen"
    timeout: 15000

# --- Discover: the rail appears once the feed answered ---
- scrollUntilVisible:
    element:
      id: "customer-home-looks-search"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "customer-home-looks-search"

# --- Style, day, window ---
- assertVisible:
    id: "customer-look-search-screen"
- tapOn:
    id: "customer-look-search-style-skin_fade"
- tapOn:
    id: "customer-look-search-day-1"
- tapOn:
    id: "customer-look-search-window-evening"
- assertVisible:
    id: "customer-look-search-photo-add"
- tapOn:
    id: "customer-look-search-search"

# --- Instant matches, never a location ---
- extendedWaitUntil:
    visible:
      id: "customer-look-search-results"
    timeout: 10000
- assertNotVisible:
    id: "customer-look-search-empty"
- assertNotVisible:
    text: ".*km.*"
- tapOn:
    id: "customer-look-search-book-.*"
    index: 0

# --- The normal booking flow, address step ---
- assertVisible:
    id: "customer-booking-location-screen"
