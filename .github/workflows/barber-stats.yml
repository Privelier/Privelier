# Nightly barber stats (migration 0050): response times, popular times and
# repeat-client rates for the app's trust/planning components.
# Free on GitHub Actions; no server to run. Needs two repository secrets:
#   SUPABASE_URL, SUPABASE_SECRET_KEY (the sb_secret_ key)
# Without them the job logs a notice and exits successfully.
name: Barber stats

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC daily, off the top-of-hour rush
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barber-stats
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python tools/automation/test_barber_stats.py
      - name: Compute and upsert barber_stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python tools/automation/compute_barber_stats.py
